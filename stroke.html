<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="describedby" href="llms.txt" type="text/plain">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A stroke &mdash; Stroke Corpus</title>
<link rel="stylesheet" href="corpus.css?v=c5bf57f2">
</head>
<body>

<header class="top">
  <div class="wrap wide">
    <p class="crumb">
      <a href="index.html">Stroke Corpus</a> &rsaquo;
      <a href="#" id="backToTake">recording</a> &rsaquo; stroke
    </p>
    <h1 id="name">&hellip;</h1>
  </div>
</header>

<main class="wrap wide">

  <noscript>
    <p class="note">
      The interactive catalogue and recording views require JavaScript.
      You can still access the data through the <a href="manifest.json">recording catalogue (JSON)</a>
      and read the <a href="FORMAT.md">trace format and interpretation</a>.
    </p>
  </noscript>

  <div class="analyser">

    <section class="panel stroke">
      <h2>Stroke <span class="sub" id="closelyNote"></span></h2>
      <canvas class="closely" id="closely"></canvas>

      <div class="transport zoombar">
        <button type="button" id="zoomOut" title="Zoom out (-)">&minus;</button>
        <button type="button" id="zoomIn" title="Zoom in (+)">+</button>
        <button type="button" id="zoomFit" title="Fit the whole stroke (0, or double-click)">Fit</button>
        <span class="at" id="zoomAt">&times;1</span>
        <label class="follow" title="Re-centre on the current reading each time it changes while zoomed in. Panning or zooming holds until then.">
          <input type="checkbox" id="follow" checked> Follow current reading
        </label>
      </div>

      <div class="transport">
        <button type="button" id="start" title="First reading">&#124;&lsaquo;</button>
        <button type="button" id="back" title="Back one reading">&lsaquo;</button>
        <button type="button" id="play">Play</button>
        <button type="button" id="next" title="On one reading">&rsaquo;</button>
        <button type="button" id="end" title="Last reading">&rsaquo;&#124;</button>
        <input type="range" id="scrub" min="0" value="0" step="1">
        <span class="at" id="at"></span>
      </div>

      <p class="note">
        Arrow keys step, space plays, Home and End jump. Scroll to zoom, drag to pan,
        double-click to fit.
      </p>
    </section>

    <section class="panel across">
      <h2>Across the stroke</h2>
      <canvas class="channel" id="pressure"></canvas>
      <canvas class="channel" id="speed"></canvas>
      <canvas class="channel" id="lean"></canvas>
    </section>

    <section class="panel reading">
      <h2>Current reading</h2>
      <dl class="facts" id="here"></dl>
    </section>

    <section class="panel every">
      <div class="inside">
        <h2>All readings</h2>
        <div class="rows scroll">
          <table>
            <thead>
              <tr>
                <th class="n">#</th>
                <th class="n">x</th>
                <th class="n">y</th>
                <th class="n">press</th>
                <th class="n">step</th>
                <th class="n" id="clockHead">ms</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </section>

  </div>

</main>

<footer class="wrap wide">
  <p><a href="index.html">Back to the corpus</a></p>
</footer>

<script type="module">
import {
  run,
  loadManifest, loadRecording, strokesOf, describe, gap,
  drawClosely, drawChannel, fmt,
} from "./corpus.js?v=da2f655d";

await run(async () => {

  const q = new URLSearchParams(location.search);
  const file = q.get("recording") || "";
  const which = parseInt(q.get("stroke") || "0", 10) || 0;

  if (!file) location.replace("index.html");

  const manifest = await loadManifest();
  const entry = manifest.recordings.find((t) => t.file === file);
  const recording = await loadRecording(file);
  const strokes = strokesOf(recording);
  const stroke = strokes[which];

  if (!stroke) {
    document.getElementById("name").textContent = "No such stroke";
    throw new Error(
      `"${file}" has ${strokes.length} strokes, so there is no stroke ${which + 1} in it.`);
  }

  const full = entry?.device.fullScalePressure || 32767;
  const r = stroke.readings;
  const about = describe(stroke);

  document.title = `${entry?.name ?? file} stroke ${which + 1} — Stroke Corpus`;
  document.getElementById("name").textContent = `${entry?.name ?? file} — stroke ${which + 1} of ${strokes.length}`;

  const back = document.getElementById("backToTake");
  back.href = `recording.html?recording=${encodeURIComponent(file)}`;
  back.textContent = entry?.name ?? "recording";

  // The table's time column names whichever clock the recording carries, because the two are
  // not the same thing: the pen's own stamp is a packet counter and the host's is a clock.
  document.getElementById("clockHead").textContent =
    entry?.columns.includes("arrived") ? "host ms" : "pen ms";

  document.getElementById("closelyNote").textContent =
    `— ${about.readings} readings over ${fmt(about.length)} px` +
    (about.approach ? `, and ${about.approach} in the air before it` : "");

  // The step into each reading, so the table and the speed channel say the same thing.
  const steps = r.map((p, i) => (i === 0 ? 0 : gap(r[i - 1], p)));

  // Speed in px per second, on whichever clock this recording carries. The pen's own stamp is a
  // packet counter, so where there is no host clock this is speed per counter-second and the
  // axis is labelled to say so.
  const clock = entry?.columns.includes("arrived") ? "arrived" : "at";
  const times = r.map((p) => (clock === "arrived" ? p.arrived : p.at));
  //
  // Averaged over a window rather than taken between neighbouring readings. Readings that came
  // off the driver in one batch share one host stamp, so between neighbours the time is either
  // zero (speed reads as zero) or a whole batch interval for a single step (speed reads as
  // several times too high), and the trace alternates between the two. The distance and the
  // time across a window both span whole batches, so the ratio is the speed.
  const WINDOW_US = 100_000;

  // path[i] is the distance travelled from the first reading to reading i, so the distance
  // across any window is a subtraction.
  const path = steps.reduce((sum, step, i) => (sum.push((sum[i - 1] ?? 0) + step), sum), []);

  const speeds = r.map((_, i) => {
    let lo = i;
    let hi = i;

    while (lo > 0 && times[i] - times[lo] < WINDOW_US / 2) lo--;
    while (hi < r.length - 1 && times[hi] - times[i] < WINDOW_US / 2) hi++;

    const dt = (times[hi] - times[lo]) / 1e6;

    return dt > 0 ? (path[hi] - path[lo]) / dt : 0;
  });

  let at = 0;
  let playing = null;

  const scrub = document.getElementById("scrub");
  scrub.max = String(r.length - 1);

  const closely = document.getElementById("closely");
  const rows = document.getElementById("rows");

  rows.innerHTML = r.map((p, i) => `
    <tr data-at="${i}">
      <td class="n">${i + 1}</td>
      <td class="n">${fmt(p.x)}</td>
      <td class="n">${fmt(p.y)}</td>
      <td class="n">${p.pressure}</td>
      <td class="n">${fmt(steps[i])}</td>
      <td class="n">${((times[i] - times[0]) / 1000).toFixed(1)}</td>
    </tr>
  `).join("");

  rows.addEventListener("click", (e) => {
    const row = e.target.closest("tr[data-at]");

    if (row) move(parseInt(row.dataset.at, 10));
  });

  // Where the stroke picture is looking. `zoom` is a multiple of the fit scale; `cx` and `cy`
  // are the stroke coordinates at the middle of the canvas, null while the whole stroke fits.
  const view = { zoom: 1, cx: null, cy: null };
  const MOST = 400;

  // What the last paint measured, which is what turns a cursor position into a stroke position.
  let geo = null;

  const zoomAt = document.getElementById("zoomAt");
  const follow = document.getElementById("follow");

  function setView(zoom, cx, cy) {
    view.zoom = Math.max(1, Math.min(MOST, zoom));

    if (view.zoom === 1) {
      view.cx = null;
      view.cy = null;
    } else {
      // Kept inside the stroke's own bounds, so it cannot be dragged out of sight.
      view.cx = Math.max(geo.box.left, Math.min(geo.box.right, cx));
      view.cy = Math.max(geo.box.top, Math.min(geo.box.bottom, cy));
    }

    paint();
  }

  // Changes the zoom while holding the stroke point under (mx, my) where it is, as a map does,
  // or the middle of the canvas where there is no cursor.
  function zoomTo(zoom, mx = geo?.width / 2, my = geo?.height / 2) {
    if (!geo) return;

    const now = geo.base * view.zoom;
    const next = geo.base * Math.max(1, Math.min(MOST, zoom));

    const x = geo.cx + (mx - geo.width / 2) / now;
    const y = geo.cy + (my - geo.height / 2) / now;

    setView(zoom, x - (mx - geo.width / 2) / next, y - (my - geo.height / 2) / next);
  }

  // `recentre` is true only when the playhead has moved (or following was just switched on).
  // Panning and zooming repaint without it, so looking somewhere else holds until the next
  // reading, and then the view comes back to it. Re-centring on every paint made the picture
  // impossible to drag while following, and made a wheel zoom ignore the cursor.
  function paint(recentre = false) {
    if (recentre && follow.checked && view.zoom > 1 && geo) {
      view.cx = r[at].x;
      view.cy = r[at].y;
    }

    geo = drawClosely(closely, stroke, at, { fullScale: full, view });

    zoomAt.textContent = `×${view.zoom < 10 ? view.zoom.toFixed(1) : Math.round(view.zoom)}`;
    closely.classList.toggle("zoomed", view.zoom > 1);

    drawChannel(document.getElementById("pressure"), stroke, (p) => p.pressure, at,
      { label: "pressure", from: 0, to: full });

    drawChannel(document.getElementById("speed"), stroke, (_, i) => speeds[i] ?? 0, at,
      { label: (clock === "arrived" ? "speed px/s" : "speed px per counter-second")
        + `, ${WINDOW_US / 1000} ms average` });

    drawChannel(document.getElementById("lean"), stroke, (p) => p.lean, at,
      { label: "lean deg", minSpan: 10 });
  }

  function move(to) {
    at = Math.max(0, Math.min(to, r.length - 1));
    scrub.value = String(at);

    const p = r[at];

    document.getElementById("at").textContent = `${at + 1} / ${r.length}`;

    document.getElementById("here").innerHTML = [
      ["x", fmt(p.x)],
      ["y", fmt(p.y)],
      ["pressure", `${p.pressure} of ${full}`],
      ["pressure %", `${(p.pressure / full * 100).toFixed(2)}%`],
      ["step into it", `${fmt(steps[at])} px`],
      ["avg speed", `${fmt(speeds[at])} px/s`],
      ["lean", `${fmt(p.lean)}°`],
      ["azimuth", `${fmt(p.azimuth)}°`],
      ["twist", `${fmt(p.twist)}°`],
      ["height", entry?.columns.includes("height") ? fmt(p.height) : "not in this format"],
      ["status", entry?.columns.includes("status") ? p.status : "not in this format"],
      ["pen clock", `${((p.at - r[0].at) / 1000).toFixed(1)} ms in`],
      ["host clock", entry?.columns.includes("arrived")
        ? `${((p.arrived - r[0].arrived) / 1000).toFixed(1)} ms in`
        : "not in this format"],
    ].map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");

    for (const row of rows.querySelectorAll("tr")) row.classList.remove("picked");

    const row = rows.querySelector(`tr[data-at="${at}"]`);

    if (row) {
      row.classList.add("picked");

      // Scrolls the list and nothing else. scrollIntoView walks every scrollable ancestor,
      // the page included, so stepping through a stroke dragged the whole page down to the
      // table's row.
      const list = rows.closest(".rows");
      const top = row.offsetTop;
      const head = list.querySelector("thead").offsetHeight;

      if (top < list.scrollTop + head) list.scrollTop = top - head;
      else if (top + row.offsetHeight > list.scrollTop + list.clientHeight) {
        list.scrollTop = top + row.offsetHeight - list.clientHeight;
      }
    }

    paint(true);
  }

  function play() {
    if (playing) {
      clearInterval(playing);
      playing = null;
      document.getElementById("play").textContent = "Play";

      return;
    }

    if (at >= r.length - 1) move(0);

    document.getElementById("play").textContent = "Pause";

    // A fifth of the rate the pen reports at, because the point is to watch what happened
    // rather than to relive it: at 162 readings a second a stroke is over before it reads.
    playing = setInterval(() => {
      if (at >= r.length - 1) return play();

      move(at + 1);
    }, 120);
  }

  document.getElementById("start").addEventListener("click", () => move(0));
  document.getElementById("back").addEventListener("click", () => move(at - 1));
  document.getElementById("next").addEventListener("click", () => move(at + 1));
  document.getElementById("end").addEventListener("click", () => move(r.length - 1));
  document.getElementById("play").addEventListener("click", play);
  scrub.addEventListener("input", () => move(parseInt(scrub.value, 10)));

  document.getElementById("zoomIn").addEventListener("click", () => zoomTo(view.zoom * 1.6));
  document.getElementById("zoomOut").addEventListener("click", () => zoomTo(view.zoom / 1.6));
  document.getElementById("zoomFit").addEventListener("click", () => setView(1));
  follow.addEventListener("change", () => paint(true));

  // Scrolling over the picture zooms it, about the cursor. Registered by hand because a wheel
  // listener added the usual way is passive, and a passive one cannot stop the page scrolling.
  closely.addEventListener("wheel", (e) => {
    e.preventDefault();

    const box = closely.getBoundingClientRect();
    const lines = e.deltaMode === 1 ? 16 : 1;

    zoomTo(view.zoom * Math.exp(-e.deltaY * lines * 0.0015), e.clientX - box.left, e.clientY - box.top);
  }, { passive: false });

  closely.addEventListener("dblclick", () => setView(1));

  let dragging = null;

  closely.addEventListener("pointerdown", (e) => {
    if (view.zoom === 1 || e.button !== 0) return;

    dragging = { x: e.clientX, y: e.clientY };
    closely.setPointerCapture(e.pointerId);
    closely.classList.add("dragging");
  });

  closely.addEventListener("pointermove", (e) => {
    if (!dragging || !geo) return;

    const scale = geo.base * view.zoom;

    setView(view.zoom, geo.cx - (e.clientX - dragging.x) / scale, geo.cy - (e.clientY - dragging.y) / scale);

    dragging = { x: e.clientX, y: e.clientY };
  });

  const drop = () => {
    dragging = null;
    closely.classList.remove("dragging");
  };

  closely.addEventListener("pointerup", drop);
  closely.addEventListener("pointercancel", drop);

  addEventListener("keydown", (e) => {
    if (e.target.matches("input, select, textarea")) return;

    const keys = {
      ArrowRight: () => move(at + 1),
      ArrowLeft: () => move(at - 1),
      ArrowUp: () => move(at + 10),
      ArrowDown: () => move(at - 10),
      Home: () => move(0),
      End: () => move(r.length - 1),
      " ": play,
      "+": () => zoomTo(view.zoom * 1.6),
      "=": () => zoomTo(view.zoom * 1.6),
      "-": () => zoomTo(view.zoom / 1.6),
      "0": () => setView(1),
    };

    if (keys[e.key]) {
      e.preventDefault();
      keys[e.key]();
    }
  });

  addEventListener("resize", () => paint());

  move(0);
});
</script>

</body>
</html>
