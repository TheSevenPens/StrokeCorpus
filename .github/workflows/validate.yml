name: Validate

# Every recording against the schema, the manifest against its schema and the folder, and the schema
# against its own examples. See tools/validate.py for what each of those means. It reads the
# recordings and never changes one.
#
# It deliberately does not rebuild manifest.json and compare: the manifest's "bytes" field is the size
# of the file as it sat on the machine that built it, which depends on that machine's line endings.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so a pull request can be compared with the branch it targets.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the validator
        run: pip install "jsonschema>=4.20"

      - name: Validate recordings, manifest and schema examples
        run: python tools/validate.py

      # Recordings are original evidence. A pull request may add recordings, and may name or rename
      # one, or say which tablet, pen, driver and firmware it was made with, but may not change anything else in one that is already here.
      - name: No recording changed except by name, tablet, pen, driver or firmware
        if: github.event_name == 'pull_request'
        run: python tools/check_names_only.py "origin/${{ github.base_ref }}"
